#################################################################################
# Font configurations for display
font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 15
    bpp: 2
  - file: "gfonts://Roboto"
    id: my_font2
    size: 12
    bpp: 2
  - file: "gfonts://Roboto"
    id: temp_font
    size: 12
    bpp: 2
 
# OLED display configuration with page switching
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 300ms
    lambda: |-
      // Clear the screen
      it.fill(COLOR_OFF);
      
      // Display current page based on global variable
      if (id(display_page) == 0) {
        // Main page - original display with relays and inputs
        
        // Display RTC time
        if (id(ds1307_time).now().is_valid()) {
          char time_str[16];
          time_t curr_time = id(ds1307_time).now().timestamp;
          strftime(time_str, sizeof(time_str), "%H:%M:%S", localtime(&curr_time));
          it.print(10, 0, id(my_font2), time_str);
        }
        
        // Draw Relay status indicators (squares)
        const int relay_y = 30;    
        const int relay_size = 8;  
        const int relay_gap = 20;  
        
        if (id(relay01).state) it.filled_rectangle(10, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10, relay_y, relay_size, relay_size, COLOR_ON);
        
        if (id(relay02).state) it.filled_rectangle(10+relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10+relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        
        if (id(relay03).state) it.filled_rectangle(10+2*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10+2*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        
        if (id(relay04).state) it.filled_rectangle(10+3*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10+3*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        
        if (id(relay05).state) it.filled_rectangle(10+4*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10+4*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        
        if (id(relay06).state) it.filled_rectangle(10+5*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);
        else it.rectangle(10+5*relay_gap, relay_y, relay_size, relay_size, COLOR_ON);


        // Draw Input status indicators (circles)
        const int input_y = 55;    
        const int input_radius = 4;
        const int input_gap = 20;  
        const int input_center_x_offset = 10 + input_radius;
        
        if (id(input01).state) it.filled_circle(input_center_x_offset, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset, input_y, input_radius, COLOR_ON);
        
        if (id(input02).state) it.filled_circle(input_center_x_offset + input_gap, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset + input_gap, input_y, input_radius, COLOR_ON);
        
        if (id(input03).state) it.filled_circle(input_center_x_offset + 2*input_gap, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset + 2*input_gap, input_y, input_radius, COLOR_ON);
        
        if (id(input04).state) it.filled_circle(input_center_x_offset + 3*input_gap, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset + 3*input_gap, input_y, input_radius, COLOR_ON);
        
        if (id(input05).state) it.filled_circle(input_center_x_offset + 4*input_gap, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset + 4*input_gap, input_y, input_radius, COLOR_ON);
        
        if (id(input06).state) it.filled_circle(input_center_x_offset + 5*input_gap, input_y, input_radius, COLOR_ON);
        else it.circle(input_center_x_offset + 5*input_gap, input_y, input_radius, COLOR_ON);

        // Section labels
        it.print(30, 15, id(my_font), "Relays");
        it.print(30, 35, id(my_font), "Inputs");
      } 
      else {
          // Display temperature 1
        if (id(tem1_sensor).has_state()) {
          char temp1_str[16];
          sprintf(temp1_str, "Tem01: %.1f C", id(tem1_sensor).state);
          it.print(0, 0, id(temp_font), temp1_str);
        } else {
          it.print(0, 0, id(temp_font), "Tem01: --.- C");
        }
        
        // Display temperature 2
        if (id(tem2_sensor).has_state()) {
          char temp2_str[16];
          sprintf(temp2_str, "Tem02: %.1f C", id(tem2_sensor).state);
          it.print(0, 20, id(temp_font), temp2_str);
        } else {
          it.print(0, 20, id(temp_font), "Tem02: --.- C");
        }
        
        // Display temperature 3
        if (id(tem3_sensor).has_state()) {
          char temp3_str[16];
          sprintf(temp3_str, "Tem03: %.1f C", id(tem3_sensor).state);
          it.print(0, 40, id(temp_font), temp3_str);
        } else {
          it.print(0, 40, id(temp_font), "Tem03: --.- C");
        }
      }

