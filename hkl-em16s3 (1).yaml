#######################################################################################################
# Add GPIO0(DL BUTTON) as page switch button with debouncing
  - platform: gpio
    name: "Page Switch Button (GPIO0)"
    id: page_switch_button
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true  # Use internal pull-up resistor
      inverted: true  # Invert state so press = true
    on_state:  # Corrected from on_state_change to on_state
      then:
        - lambda: |-
            // Simple debounce handling (20ms)
            unsigned long current_time = millis();
            if (current_time - id(last_debounce_time) > 20) {
              // Only process if state changed and stable
              if (id(page_switch_button).state != id(last_button_state)) {
                id(last_button_state) = id(page_switch_button).state;
                // Switch page when button is pressed (state is true)
                if (id(page_switch_button).state) {
                  id(display_page) = (id(display_page) + 1) % 2;
                }
              }
            }
            id(last_debounce_time) = current_time;
    
#######################################################################################################
# I2C bus configuration
i2c:
  sda: 17
  scl: 18
  scan: true
  id: bus_a
#######################################################################################################
# MCP4728 DAC configuration for 0-10V output
mcp4728:
  - id: dac_output
   # address: 0x60  # The address is on the back label of the product. 
    #  address: 0x61  
    address: 0x62

output:
############################################
########  output 0-10V ##########
  - platform: mcp4728
    id: dac_channel_a
    mcp4728_id: dac_output
    channel: A
    vref: vdd
    gain: x2
    power_down: normal
  
  - platform: mcp4728
    id: dac_channel_b
    mcp4728_id: dac_output
    channel: B
    vref: vdd
    gain: x2
    power_down: normal
############################################
########  output 4-20ma ##########
  - platform: mcp4728
    id: dac_channel_c
    mcp4728_id: dac_output
    channel: C
    vref: vdd
    power_down: normal
#########################################

light:
  - platform: monochromatic
    name: "DAC Output 0-10V"
    id: light_a
    output: dac_channel_a
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "DAC2 Output 0-10V"
    id: light_b
    output: dac_channel_b
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    name: "DAC3 Output 4-20mA"
    id: light_c
    output: dac_channel_c
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_OFF
#######################################################################################################
# ADS1115 ADC configuration
ads1115:
  - address: 0x49
    i2c_id: bus_a
#######################################################################################################
# DS18B20 temperature sensor configuration
one_wire:
  - platform: gpio
    pin: GPIO1
    id: tem01
  - platform: gpio
    pin: GPIO2
    id: tem02
  - platform: gpio
    pin: GPIO3
    id: tem03
sensor:
  - platform: dallas_temp
  #The address of the DS18B20 will be printed in the log file. Copy the printed address to the "address" field.
    address: 0x830000000000
    name: "tem1"
    id: tem1_sensor
    one_wire_id: tem01
    update_interval: 5s
  - platform: dallas_temp
    address: 0x0000000000000
    name: "tem2"
    id: tem2_sensor
    one_wire_id: tem02
    update_interval: 5s
  - platform: dallas_temp
    address: 0x830000006ad10728
    name: "tem3"
    id: tem3_sensor
    one_wire_id: tem03
    update_interval: 5s
######################################################################
# 0-10V and 4-20mA detection configuration
  - platform: ads1115
    # Measure the voltage between A0 and A1
    multiplexer: 'A0_A1'
    # Gain setting for the ADC
    gain: 6.144
    # Name of the sensor in Home Assistant
    name: "SCT013-30A-1V"
    # Update interval for the sensor
    update_interval: 3s

  - platform: ads1115
    # ID for the sensor
    id: ads1115_02
    # Measure the voltage between A2 and GND
    multiplexer: 'A2_GND'
    # Gain setting for the ADC
    gain: 6.144
    # Name of the sensor in Home Assistant
    name: "0-10V"
    # Update interval for the sensor
    update_interval: 2s
    filters:
    - lambda: return x * 2;

  - platform: ads1115
    # ID for the raw voltage sensor
    id: ads1115_03_raw
    # Measure the voltage between A3 and GND
    multiplexer: 'A3_GND'
    # Gain setting for the ADC
    gain: 6.144
    # Update interval for the sensor
    update_interval: 2s
    # Set the sensor as internal, not visible in Home Assistant
    internal: true
    on_value:
      then:
        - lambda: |-
            // Sampling resistor value in ohms
            const float sampling_resistor = 200.0;
            // Convert voltage to current in milliamperes
            float current = (id(ads1115_03_raw).state / sampling_resistor) * 1000;
            // Publish the converted current value to the custom sensor
            id(ads1115_03_current).publish_state(current);

  - platform: template
    # ID for the custom current sensor
    id: ads1115_03_current
    # Name of the sensor in Home Assistant
    name: "4-20mA"
    # Unit of measurement for the sensor
    unit_of_measurement: "mA"
    # Number of decimal places for the sensor value
    accuracy_decimals: 2
    # State class for the sensor
    state_class: measurement

