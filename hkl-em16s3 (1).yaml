esphome:
  name: hkl-em16s3
  friendly_name: HKL-EM16S3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "riHNpg792ORMMvL1ieNXfxmMvejq7eqrIE5JI3Z9jZw="

ota:
  - platform: esphome
    password: "eb56342105782702d4f40215976de9ac"

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  # Configure network settings according to your environment
  manual_ip:
    static_ip: 192.168.50.200
    gateway: 192.168.50.1
    subnet: 255.255.255.0
# RTC (Real-Time Clock) configuration
time:
  - platform: ds1307
    id: ds1307_time
    update_interval: never
    on_time:
      - seconds: 0
        then:
          - text_sensor.template.publish:
              id: rtc_time_str
              state: !lambda |-
                auto time = id(ds1307_time).now();
                return time.strftime("%Y-%m-%d %H:%M:%S");
          - text_sensor.template.publish:
              id: rtc_date_str
              state: !lambda |-
                auto time = id(ds1307_time).now();
                return time.strftime("%Y-%m-%d");
          - text_sensor.template.publish:
              id: rtc_time_only_str
              state: !lambda |-
                auto time = id(ds1307_time).now();
                return time.strftime("%H:%M:%S");

  - platform: homeassistant
    on_time_sync:
      then:
        # Update RTC when time synchronizes with Home Assistant
        - ds1307.write_time:
#################################################################################
# RTC text sensors for Home Assistant display
text_sensor:
  - platform: template
    id: rtc_time_str
    name: "RTC DATA_TIME"
    icon: "mdi:clock"
    update_interval: never  

  - platform: template
    id: rtc_date_str
    name: "RTC DATA"
    icon: "mdi:calendar"
    update_interval: never

  - platform: template
    id: rtc_time_only_str
    name: "RTC TIME"
    icon: "mdi:clock-time-eight"
    update_interval: never
####################################################################
# UART configurations (LORA, RS232, RS485)
uart:
  - id: 'LORA'
    tx_pin: GPIO41
    rx_pin: GPIO38
    baud_rate: 9600

  - id: 'UART_RS232'
    tx_pin: GPIO20    
    rx_pin: GPIO19
    baud_rate: 9600 

  - id: 'UART_RS485'
    tx_pin: GPIO48    
    rx_pin: GPIO47
    baud_rate: 9600

# Buttons for UART message transmission
button:   
  - platform: uart
    uart_id: LORA
    name: "LORA send message"
    data: 'LORA_SEND_HANKERILA'  
  - platform: uart
    uart_id: UART_RS232
    name: "RS232 send message"
    data: 'RS232_SEND_HANKERILA'  
  - platform: uart
    uart_id: UART_RS485
    name: "RS485 send message"
    data: 'RS485_SEND_HANKERILA'  
